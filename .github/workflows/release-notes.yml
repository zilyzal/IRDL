name: release notes

# Rewrites the notes of every release (drafts and published) from CHANGELOG.md, with each release's
# checksums. Run it after editing the changelog. A release whose version has no changelog section is left as it is.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' | while read -r tag; do
            if notes=$(node tools/release-notes.mjs "$tag"); then
              gh release edit "$tag" --notes "$notes" && echo "updated $tag"
            else
              echo "skipped $tag (no changelog section)"
            fi
          done
