name: android

# Builds only the Android companion app (the build workflow builds it too, next to the console app) and keeps the APK
# as a run artifact. A quick way to check a change to android/ without the console toolchain.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build the APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee "$RUNNER_TEMP/android.log" || {
            code=$?
            msg=$(grep -E -A3 '^e: |What went wrong|error:|Could not' "$RUNNER_TEMP/android.log" | sed 's#file://[^ ]*/android/##' | head -n 25 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=android build failed::$msg"
            exit $code
          }

      - uses: actions/upload-artifact@v4
        with:
          name: IRDL-Companion
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
