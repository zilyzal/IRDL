name: build

# Builds run only from Run workflow: a push builds nothing. Each run puts its build in a draft
# release; publishing that draft creates its tag, and no build runs on tags, so players get the
# very files that were tested.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # The tests run before the toolchain is installed: a failing test costs minutes, not an hour.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the tests
        run: npm run test:all

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 llvm-18 llvm-18-dev cmake ninja-build nodejs npm python3-venv \
            zlib1g-dev build-essential pkg-config unzip zip curl zstd exfatprogs exfat-fuse
          # The build wants unversioned clang and llvm-config in --llvm.
          for tool in clang clang++ llvm-config; do
            sudo ln -sf "/usr/bin/$tool-18" "/usr/local/bin/$tool"
          done
          clang --version | head -1
          llvm-config --version

      - name: Install the Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -r ps5-react/requirements.txt
          # The build spawns python3 for its own tools, so the venv goes on PATH.
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Check the exfat packaging
        run: |
          mkdir -p "$RUNNER_TEMP/check/payload"
          printf 'eboot' > "$RUNNER_TEMP/check/payload/eboot.bin"
          # Big enough that the image gets the same geometry as the real one.
          head -c 24000000 /dev/urandom > "$RUNNER_TEMP/check/payload/data.bin"
          sudo bash packaging/make-exfat.sh "$RUNNER_TEMP/check/payload" \
            "$RUNNER_TEMP/check/check.exfat" CHECK

      - name: Cache the downloaded sources
        uses: actions/cache@v4
        with:
          path: ps5-react/.deps
          key: deps-${{ hashFiles('ps5-react/dependencies.lock.json') }}

      - name: Check the version
        # Installed copies compare the release tag (named after app/version.js) with their own VERSION, and
        # check update.zip's package version against it (app/state/updater.js contentVersionOf: 0.2.3 is
        # 01.002.003). A build whose app.json says otherwise is refused by every installer.
        run: |
          python3 - <<'EOF'
          import json, re, sys
          version = re.search(r'var VERSION = "([^"]+)"', open("app/version.js", encoding="utf-8").read()).group(1)
          major, minor, patch = (list(map(int, re.match(r"(\d+)\.(\d+)\.(\d+)", version).groups())))
          expected = f"{major + 1:02d}.{minor:03d}.{patch:03d}"
          app = json.load(open("app/app.json", encoding="utf-8"))
          problems = []
          if app["version"] != expected:
              problems.append(f'app.json version is {app["version"]}, but VERSION {version} needs {expected}')
          if app.get("userAgent") and f"IRDL/{version} " not in app["userAgent"] + " ":
              problems.append(f'app.json userAgent ({app["userAgent"]}) does not name {version}')
          print("\n".join(problems) or f"VERSION {version}, package version {expected}")
          sys.exit(1 if problems else 0)
          EOF

      - name: Build
        working-directory: ps5-react
        run: |
          set -o pipefail
          python3 tools/build_ps5.py --app-dir "$GITHUB_WORKSPACE/app" --llvm /usr/bin 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            code=$?
            # Annotations stay readable through the API when the raw log is not.
            msg=$(tail -n 4 "$RUNNER_TEMP/build.log" | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build failed::$msg"
            exit $code
          }

      - name: Package
        run: |
          # The image is made from a copy of the verified build with the documentation added as /docs.
          cp -a ps5-react/dist/PPSA99573 stage
          bash packaging/stage-docs.sh stage
          sudo bash packaging/make-exfat.sh stage IRDL.exfat IRDL
          # The app folder as installed copies download it to check an update (app/state/auto-update.js).
          cp ps5-react/dist/PPSA99573.zip update.zip
          ls -l IRDL.exfat update.zip ps5-react/dist/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: IRDL
          path: |
            IRDL.exfat
            update.zip
            ps5-react/dist/PPSA99573.receipt.json
          if-no-files-found: error

  # The Android companion app (android/): one signed APK, built in parallel with the console app.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk IRDL-Companion.apk
          ls -l IRDL-Companion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IRDL-Companion
          path: IRDL-Companion.apk
          if-no-files-found: error

  release:
    # The console app's release does not wait on the Android app failing: without its APK the draft simply has none.
    needs: [ps5, android]
    if: ${{ !cancelled() && needs.ps5.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: IRDL
          path: files

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: IRDL-Companion
          path: files

      - name: Draft release
        # Only people with write access see a draft, and the in-app update check
        # (releases/latest) never returns one, so a test build reaches nobody else.
        # The draft is named after app/version.js; building again replaces its files
        # and moves it to this commit. A version already published is left alone.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*var VERSION = "\([^"]*\)".*/\1/p' app/version.js)
          test -n "$version" || { echo "no VERSION in app/version.js" >&2; exit 1; }
          tag="v$version"
          # The two files an installed copy checks (IRDL.exfat and update.zip), and the Android app, which it ignores.
          assets="files/IRDL.exfat files/update.zip"
          apk=""
          if [ -f files/IRDL-Companion.apk ]; then assets="$assets files/IRDL-Companion.apk"; apk="--apk"; else echo "::warning::no Android APK in this build"; fi
          # The notes are this version's section of CHANGELOG.md (tools/release-notes.mjs); a version with none says
          # it is a test build.
          notes() { node tools/release-notes.mjs "$version" $apk 2>/dev/null || echo "Test build of $GITHUB_SHA."; }
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | .draft")
          case "$draft" in
            "")
              gh release create "$tag" $assets --draft --target "$GITHUB_SHA" \
                --title "IRDL $tag" --notes "$(notes)" ;;
            true)
              gh release edit "$tag" --target "$GITHUB_SHA" --notes "$(notes)"
              gh release upload "$tag" $assets --clobber ;;
            *)
              echo "$tag is already published: raise the version in app/version.js" >&2
              exit 1 ;;
          esac
          gh release view "$tag" --json isDraft,tagName,assets \
            --jq '"\(.tagName) draft=\(.isDraft) " + ([.assets[] | "\(.name) \(.size)"] | join(", "))'
